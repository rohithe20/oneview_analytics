<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OneView{% endblock %} - OneView Learning Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-screen flex bg-slate-50 text-slate-900 overflow-hidden">

    <aside class="w-60 shrink-0 bg-white border-r border-slate-200 flex flex-col">
        <div class="px-6 py-5 border-b border-slate-200">
            <span class="text-lg font-semibold text-violet-700">OneView</span>
            <p class="text-xs text-slate-500">Learning Analytics</p>
        </div>

        <nav class="flex-1 px-3 py-4 space-y-1">
            <a href="/overview"
               class="block px-3 py-2 rounded-lg text-sm font-medium
                      {% if active_nav == 'overview' %}bg-violet-50 text-violet-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
                Overview
            </a>
            <a href="/record"
               class="block px-3 py-2 rounded-lg text-sm font-medium
                      {% if active_nav == 'record' %}bg-violet-50 text-violet-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
                Record Practice Paper
            </a>
            <a href="/topic-analysis"
               class="block px-3 py-2 rounded-lg text-sm font-medium
                      {% if active_nav == 'topic-analysis' %}bg-violet-50 text-violet-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}">
                Topic Analysis
            </a>
        </nav>

        <div class="px-3 py-4 border-t border-slate-200">
            <div class="flex items-center gap-3 px-3 py-2">
                <div class="h-9 w-9 shrink-0 rounded-full bg-violet-600 text-white flex items-center justify-center text-sm font-semibold">
                    {{ student_initials }}
                </div>
                <div class="min-w-0">
                    <p class="text-sm font-medium text-slate-900 truncate">{{ student_name }}</p>
                    <p class="text-xs text-slate-500">{{ exam_level }} Level Student</p>
                </div>
            </div>
            <a href="#" class="block px-3 py-2 text-sm text-slate-500 hover:text-slate-700">
                Log out
            </a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-16 shrink-0 bg-white border-b border-slate-200 flex items-center justify-between px-6">
            <h1 class="text-lg font-semibold text-slate-900">{% block page_heading %}{% endblock %}</h1>

            <div class="flex items-center gap-4">
                <div class="inline-flex rounded-lg border border-slate-200 p-0.5 bg-slate-100">
                    <button type="button"
                            class="px-3 py-1.5 text-sm font-medium rounded-md
                                   {% if exam_level == 'AS' %}bg-white text-violet-700 shadow-sm{% else %}text-slate-500{% endif %}">
                        AS
                    </button>
                    <button type="button"
                            class="px-3 py-1.5 text-sm font-medium rounded-md
                                   {% if exam_level == 'A' %}bg-white text-violet-700 shadow-sm{% else %}text-slate-500{% endif %}">
                        A
                    </button>
                </div>
                <span class="text-sm font-medium text-slate-700">{{ student_name }}</span>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
