<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OneView{% endblock %} - OneView Learning Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-screen flex bg-slate-100 text-slate-900 overflow-hidden" hx-boost="true">

    <aside class="w-60 shrink-0 bg-indigo-950 text-white flex flex-col">
        <div class="px-5 py-6 flex items-center gap-3">
            <span class="h-9 w-9 shrink-0 rounded-full border-2 border-white/90 flex items-center justify-center">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 15l5-5 3.5 3.5L20 6" />
                </svg>
            </span>
            <span class="text-base font-bold tracking-[0.18em]">ONEVIEW</span>
        </div>

        <nav class="flex-1 px-3 py-2 space-y-1.5">
            <a href="/overview"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium leading-tight
                      {% if active_nav == 'overview' %}bg-indigo-600 text-white shadow-lg shadow-indigo-950/60{% else %}text-indigo-200 hover:bg-white/10 hover:text-white{% endif %}">
                <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                </svg>
                <span>Overview</span>
            </a>
            <a href="/record"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium leading-tight
                      {% if active_nav == 'record' %}bg-indigo-600 text-white shadow-lg shadow-indigo-950/60{% else %}text-indigo-200 hover:bg-white/10 hover:text-white{% endif %}">
                <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                </svg>
                <span>Record<br>Practice Paper</span>
            </a>
            <a href="/topic-analysis"
               class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium leading-tight
                      {% if active_nav == 'topic-analysis' %}bg-indigo-600 text-white shadow-lg shadow-indigo-950/60{% else %}text-indigo-200 hover:bg-white/10 hover:text-white{% endif %}">
                <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
                </svg>
                <span>Topic Analysis</span>
            </a>
        </nav>

        <div class="px-3 pb-5 pt-4">
            <div class="flex items-center gap-3 px-2 py-2">
                <div class="h-10 w-10 shrink-0 rounded-full bg-indigo-500 text-white flex items-center justify-center text-sm font-semibold">
                    {{ student_initials }}
                </div>
                <div class="min-w-0">
                    <p class="text-sm font-semibold text-white truncate">{{ student_name }}</p>
                    <p class="text-xs text-indigo-300 flex items-center gap-1">
                        {{ exam_level }} Level Student
                        <svg class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                        </svg>
                    </p>
                </div>
            </div>
            <div class="mt-4 border-t border-white/10 pt-3">
                <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium text-indigo-200 hover:bg-white/10 hover:text-white">
                    <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                    </svg>
                    <span>Log out</span>
                </a>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="shrink-0 bg-white border-b border-slate-200 flex items-center gap-6 px-8 py-4">
            <h1 class="text-2xl font-bold text-slate-900 truncate">{{ student_name }}</h1>

            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-500">Exam Level:</span>
                <div class="inline-flex rounded-lg bg-slate-100 p-1">
                    <a href="/overview?level=AS"
                       class="px-4 py-1.5 text-sm font-semibold rounded-md
                              {% if exam_level == 'AS' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-500 hover:text-slate-700{% endif %}">
                        AS Level
                    </a>
                    <a href="/overview?level=A"
                       class="px-4 py-1.5 text-sm font-semibold rounded-md
                              {% if exam_level == 'A' %}bg-indigo-600 text-white shadow-sm{% else %}text-slate-500 hover:text-slate-700{% endif %}">
                        A Level
                    </a>
                </div>
            </div>

            <a href="/record"
               class="ml-auto inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                Record Practice Paper
            </a>
        </header>

        <main class="flex-1 overflow-y-auto px-6 py-6">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
